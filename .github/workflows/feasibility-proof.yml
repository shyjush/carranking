name: CarRanking feasibility proof (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/feasibility-proof.yml']
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check actual website and original K5 listing from GitHub runner
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,re,json,datetime
          urls={
            "carranking_home":"https://carranking.kr/",
            "k5_individual_28169893":"https://www.kbchachacha.com/public/car/detail.kbc?carSeq=28169893",
            "k5_individual_28451674":"https://m.kbchachacha.com/public/web/car/detail.kbc?carSeq=28451674",
          }
          results={}
          for key,url in urls.items():
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (CarRanking read-only feasibility test)"})
              with urllib.request.urlopen(req,timeout=15) as r:
                html=r.read(1200000).decode("utf-8",errors="replace")
                info={"http_status":r.status,"bytes":len(html)}
                if key=="carranking_home":
                  info["has_reference_section"]="historicalRankingBody" in html
                  info["has_rank_section"]="rankingBody" in html
                  info["references_versioned_css"]="styles.css?v=" in html
                else:
                  flat=re.sub(r"\\s+"," ",re.sub(r"<[^>]+>"," ",html))
                  info["k5_3rd_gen"]="K5 3세대" in flat
                  info["prestige"]="프레스티지" in flat
                  info["year_2020"]=bool(re.search(r"20년\\d{2}월|2020년",flat))
                  info["price_present"]=any(v in flat for v in ["2,150만원","1,560만원"])
                results[key]=info
            except Exception as e:
              results[key]={"error":str(e)[:200]}
          print(json.dumps(results,ensure_ascii=False,indent=2))
          print("TEST PURPOSE: Read-only proof, not permission to collect commercially or publish unverified data.")
          with open('feasibility-results.json','w') as f:json.dump(results,f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: carranking-feasibility-proof
          path: feasibility-results.json
          retention-days: 7
