name: Verify CarRanking ranking source integrity
on:
  pull_request:
    paths: [app.js, home-fixes.js, vehicle-selector-hotfix.js, ranking-brand-expansion.js, scripts/test-verified-ranking.cjs, .github/workflows/verify-ranking.yml]
  push:
    branches: [main]
    paths: [app.js, home-fixes.js, vehicle-selector-hotfix.js, ranking-brand-expansion.js, scripts/test-verified-ranking.cjs, .github/workflows/verify-ranking.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Syntax check
        run: |
          node --check app.js
          node --check home-fixes.js
          node --check vehicle-selector-hotfix.js
          node --check ranking-brand-expansion.js
      - name: Source and trim evidence gate tests
        run: node scripts/test-verified-ranking.cjs
