name: Audit CarRanking Supabase data

on:
  push:
    paths:
      - '.github/workflows/audit-supabase.yml'
  workflow_dispatch:
  schedule:
    # 03:50 KST daily; audit only, no synthetic depreciation data.
    - cron: '50 18 * * *'

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Audit database counts
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$PGPASSWORD" ]; then echo 'BLOCKED: SUPABASE_DB_PASSWORD is missing' >&2; exit 2; fi
          CONN="host=aws-0-ap-northeast-2.pooler.supabase.com port=5432 dbname=postgres user=postgres.ikhyadzboorscjwcrhcz sslmode=require"
          echo "=== CarRanking Supabase audit ==="
          psql "$CONN" -Atc "select 'manufacturers='||count(*) from public.manufacturers;"
          psql "$CONN" -Atc "select 'models='||count(*) from public.car_models;"
          psql "$CONN" -Atc "select 'generations='||count(*) from public.generations;"
          psql "$CONN" -Atc "select 'current_generations='||count(*) from public.generations where current=true;"
          psql "$CONN" -Atc "select 'vehicle_specs='||count(*) from public.vehicle_specs;"
          psql "$CONN" -Atc "select 'depreciation_metrics='||count(*) from public.depreciation_metrics;"
          psql "$CONN" -Atc "select 'value_ranking_rows='||count(*) from public.web_value_ranking;"
          psql "$CONN" -Atc "select 'vehicle_detail_rows='||count(*) from public.web_vehicle_detail;"
          psql "$CONN" -Atc "select 'compare_rows='||count(*) from public.web_compare_base;"
          psql "$CONN" -Atc "select 'missing_specs_generations='||count(*) from public.generations g where not exists (select 1 from public.vehicle_specs s where s.generation_id=g.id);"
          psql "$CONN" -Atc "select 'ratings='||count(*) from public.ratings;"
          psql "$CONN" -Atc "select 'reviews='||count(*) from public.reviews;"
          psql "$CONN" -Atc "select 'new_verified_market_snapshots='||count(*) from public.market_snapshots where confidence in ('A','B') and source_url like 'https://%' and listing_count > 0 and created_at >= now()-interval '7 days';"
          psql "$CONN" -Atc "select 'markets_missing_source_or_sample='||count(*) from public.market_snapshots where source_url is null or listing_count is null or listing_count < 1;"
          UNSUPPORTED=$(psql "$CONN" -Atc "select count(*) from public.depreciation_metrics d where d.confidence in ('A','B') and not exists(select 1 from public.market_snapshots s where s.generation_id=d.generation_id and s.model_year=d.model_year and s.as_of_date=d.as_of_date and s.confidence in ('A','B'));")
          echo "metrics_without_matching_market_snapshots=$UNSUPPORTED"
          if [ "$UNSUPPORTED" -gt 0 ]; then echo "::warning::$UNSUPPORTED A/B depreciation metrics lack a matching verified market snapshot. Do not recalculate or advance evidence date."; fi
