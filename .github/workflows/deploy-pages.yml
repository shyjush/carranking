name: Deploy CarRanking to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Force latest CarRanking runtime versions
        run: |
          sed -i 's/config.js?v=5/config.js?v=10/g' index.html
          sed -i 's/config.js?v=8/config.js?v=10/g' index.html
          sed -i 's/config.js?v=9/config.js?v=10/g' index.html
          sed -i 's/header-actions.js?v=5/header-actions.js?v=6/g' index.html
          sed -i 's/car-reputation.js?v=1.2/car-reputation.js?v=1.3/g' index.html
          sed -i 's/owner-display-hotfix.js?v=2/owner-display-hotfix.js?v=7/g' index.html
          sed -i 's#</body></html>#<script src="home-fixes.js?v=6"></script><script src="review-form-cleanup-v2.js?v=3"></script></body></html>#' index.html
          sed -i 's#</body></html>#<script src="admin-cleanup.js?v=1"></script><script src="../admin-session-fix.js?v=1"></script><script src="../admin-login-fix-v2.js?v=2"></script></body></html>#' admin/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
