name: Deploy CarRanking to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Force latest CarRanking runtime versions
        run: |
          sed -i 's/config.js?v=5/config.js?v=10/g' index.html
          sed -i 's/config.js?v=8/config.js?v=10/g' index.html
          sed -i 's/config.js?v=9/config.js?v=10/g' index.html
          sed -i 's/header-actions.js?v=5/header-actions.js?v=6/g' index.html
          sed -i 's/car-reputation.js?v=1.2/car-reputation.js?v=1.3/g' index.html
          sed -i 's/car-reputation-hotfix.js?v=1/car-reputation-hotfix.js?v=2/g' index.html
          sed -i 's/owner-display-hotfix.js?v=2/owner-display-hotfix.js?v=7/g' index.html
          sed -i 's#</body></html>#<script src="home-fixes.js?v=9"></script><script src="review-form-cleanup-v2.js?v=3"></script><script src="seo-links.js?v=1"></script></body></html>#' index.html
          sed -i 's#</body></html>#<script src="admin-cleanup.js?v=1"></script><script src="../admin-session-fix.js?v=1"></script><script src="../admin-login-fix-v2.js?v=2"></script></body></html>#' admin/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Allow Pages artifact metadata to become available
        run: sleep 20
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Install headless browser controller
        run: |
          npm install --prefix "$RUNNER_TEMP/carranking-playwright" --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -x "$CHROME_BIN" || { echo "Chrome not found: cannot claim live-site verified"; exit 1; }
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Verify deployed desktop and mobile CarRanking screens
        env:
          CARRANKING_LIVE_URL: https://carranking.kr/
        run: node scripts/live-site-smoke.cjs
      - name: Verify live economic calculator numbers on desktop and mobile
        run: node scripts/economy-live-smoke.cjs
      - name: Verify live folded comments and reply panels
        run: node scripts/member-comments-live-smoke.cjs
      - name: Preserve actual-screen proof and QA result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carranking-production-visual-QA
          path: site-smoke-artifacts/
          if-no-files-found: warn
          retention-days: 14
