name: CarRanking official efficiency coverage monitor
on:
  push:
    paths:
      - '.github/workflows/weekly-official-efficiency.yml'
      - 'scripts/weekly-official-efficiency-monitor.py'
      - 'scripts/import-reviewed-official-efficiency.py'
      - 'data/reviewed-official-efficiency.csv'
      - 'scripts/official-api-sync.py'
      - 'scripts/kea-auto-import.py'
      - 'scripts/kea-catalog-sync.py'
      - 'scripts/ai-kea-match.py'
  workflow_dispatch:
  schedule:
    # Every Sunday 04:10 KST (Saturday 19:10 UTC), after weekly 03:50 DB audit.
    - cron: '10 19 * * 6'
permissions:
  contents: read
jobs:
  audit-official-efficiency:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
      KEA_SERVICE_KEY: ${{ secrets.KEA_SERVICE_KEY }}
      KEA_API_URL: ${{ vars.KEA_API_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MATCH_MODEL: gpt-4o-mini
      AI_MATCH_MAX_CALLS: '8'
    steps:
      - name: Checkout CarRanking
        uses: actions/checkout@v4
      - name: Install PostgreSQL command-line client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Check missing official fuel economy and official manufacturer pages
        run: python3 scripts/weekly-official-efficiency-monitor.py
      - name: Safely insert any manually verified manufacturer efficiency records
        run: python3 scripts/import-reviewed-official-efficiency.py
      - name: Ingest verified official nationwide fuel prices and stage official energy API
        run: python3 scripts/official-api-sync.py
      - name: Automatically match and import unambiguous KEA official efficiency records
        run: python3 scripts/kea-auto-import.py
      - name: Update official KEA vehicle catalog without changing existing vehicle generations
        run: python3 scripts/kea-catalog-sync.py
      - name: Analyze unresolved official variants with bounded AI suggestions
        run: python3 scripts/ai-kea-match.py
      - name: Add workflow summary
        if: always()
        run: |
          echo '## CarRanking official efficiency audit' >> "$GITHUB_STEP_SUMMARY"
          for item in summary.md official-api-status.json kea-auto-import.json kea-catalog-import.json; do
            path="official-economy-reports/$item"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo "### $item" >> "$GITHUB_STEP_SUMMARY"
            if [ -f "$path" ]; then
              echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
              cat "$path" >> "$GITHUB_STEP_SUMMARY"
              echo '' >> "$GITHUB_STEP_SUMMARY"
              echo '~~~' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'Not produced (prior step may have failed or been skipped).' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Preserve weekly coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-efficiency-coverage
          path: official-economy-reports/
          if-no-files-found: warn
          retention-days: 30
