name: CarRanking daily source-evidence worklist
on:
  workflow_dispatch:
  # B-plan: historical used-listing validation is manual only; no daily scheduler.
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-latest
    env:
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - name: Generate complete unresolved evidence and specification queues
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PGPASSWORD" || { echo 'Database credentials absent'; exit 2; }
          CONN="host=aws-0-ap-northeast-2.pooler.supabase.com port=5432 dbname=postgres user=postgres.ikhyadzboorscjwcrhcz sslmode=require"
          mkdir -p evidence-worklist
          psql "$CONN" -v ON_ERROR_STOP=1 -c "
          COPY (
            SELECT mf.name AS manufacturer, cm.name AS model, coalesce(g.generation_code,g.name) AS generation,
              d.model_year,d.as_of_date,d.confidence,d.sample_size,d.original_price_krw,d.used_price_krw,
              CASE WHEN EXISTS (SELECT 1 FROM public.trims t JOIN public.powertrains p ON p.id=t.powertrain_id
                WHERE p.generation_id=g.id AND t.model_year=d.model_year AND t.price_krw=d.original_price_krw
                  AND t.source_url LIKE 'https://%')
              THEN 'historical_trim_price_present' ELSE 'historical_trim_price_missing' END AS original_price_status,
              'needs_source_URL_observed_date_exact_trim_dedupe' AS market_status
            FROM public.depreciation_metrics d
            JOIN public.generations g ON g.id=d.generation_id
            JOIN public.car_models cm ON cm.id=g.car_model_id
            JOIN public.manufacturers mf ON mf.id=cm.manufacturer_id
            WHERE d.confidence IN ('A','B') AND NOT EXISTS (
              SELECT 1 FROM public.market_snapshots s WHERE s.generation_id=d.generation_id
                AND s.model_year=d.model_year AND s.as_of_date=d.as_of_date AND s.confidence IN ('A','B'))
            ORDER BY CASE WHEN d.sample_size>=5 THEN 0 ELSE 1 END,d.sample_size DESC NULLS LAST,d.as_of_date DESC
            
          ) TO STDOUT WITH (FORMAT csv, HEADER true);
          " > evidence-worklist/unmatched-value-all.csv
          psql "$CONN" -v ON_ERROR_STOP=1 -c "
          COPY (
            SELECT mf.name AS manufacturer,cm.name AS model,coalesce(g.generation_code,g.name) AS generation,
              g.start_year,g.current,
              CASE WHEN EXISTS(SELECT 1 FROM public.powertrains p WHERE p.generation_id=g.id)
                THEN 'powertrain_present' ELSE 'powertrain_missing' END AS powertrain_status,
              'official_source_required' AS source_status
            FROM public.generations g
            JOIN public.car_models cm ON cm.id=g.car_model_id
            JOIN public.manufacturers mf ON mf.id=cm.manufacturer_id
            WHERE NOT EXISTS(SELECT 1 FROM public.vehicle_specs s WHERE s.generation_id=g.id)
            ORDER BY g.current DESC,g.start_year DESC,mf.name,cm.name 
          ) TO STDOUT WITH (FORMAT csv, HEADER true);
          " > evidence-worklist/missing-specs-all.csv
          # Retain the whole unresolved inventory AND a compact priority batch for daily review.
          head -n 11 evidence-worklist/unmatched-value-all.csv > evidence-worklist/unmatched-value-top10.csv
          head -n 11 evidence-worklist/missing-specs-all.csv > evidence-worklist/missing-specs-top10.csv
          VALUE_ROWS=$(($(wc -l < evidence-worklist/unmatched-value-all.csv)-1))
          SPEC_ROWS=$(($(wc -l < evidence-worklist/missing-specs-all.csv)-1))
          {
            echo '## CarRanking evidence investigation queue'
            echo "Unmatched value metrics: $(psql "$CONN" -Atc "SELECT count(*) FROM public.depreciation_metrics d WHERE d.confidence IN ('A','B') AND NOT EXISTS(SELECT 1 FROM public.market_snapshots s WHERE s.generation_id=d.generation_id AND s.model_year=d.model_year AND s.as_of_date=d.as_of_date AND s.confidence IN ('A','B'))")"
            echo "Missing-spec generations: $(psql "$CONN" -Atc "SELECT count(*) FROM public.generations g WHERE NOT EXISTS(SELECT 1 FROM public.vehicle_specs s WHERE s.generation_id=g.id)")"
            echo "Full evidence queue: $VALUE_ROWS rows; missing spec queue: $SPEC_ROWS generations."
            echo 'Priority review sample: first 10 from each full inventory; all candidates retained as CSV artifacts.'
            echo 'This worklist never auto-approves sources, fabricates listing URLs, or modifies public ranking rows.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate submitted individual listing evidence (fail closed)
        run: node scripts/validate-market-evidence.cjs

      - name: Check public original individual listing pages (fail closed)
        run: node scripts/audit-original-market-pages.cjs

      - name: Apply independently approved evidence to CarRanking database only
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/apply-reviewed-market-evidence.cjs

      - name: Report evidence verification results
        shell: bash
        run: |
          node - <<'NODE'
          const report=require('./evidence-worklist/validated-listings.json');
          const fs=require('fs');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '\n### Independent listing evidence validation\n' +
            '- Submitted cases: '+report.checked+'\n' +
            '- Structurally eligible: '+report.approved.length+' (not automatically published)\n' +
            '- Held: '+report.held.length+'\n' +
            '- Zero submissions means no original listings were verified.\n');
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: carranking-daily-evidence-worklist
          path: evidence-worklist/
          retention-days: 30
