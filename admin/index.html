<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CarRanking 관리자</title><style>
:root{--blue:#2563eb;--ink:#162033;--muted:#64748b;--line:#dfe6ef}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--ink);font-family:Arial,"Noto Sans KR",sans-serif}.wrap{max-width:1280px;margin:auto;padding:28px 16px 50px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.top h1{margin:0}.top a{color:var(--blue);font-weight:800;text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px;box-shadow:0 8px 24px rgba(15,23,42,.04)}.muted{color:var(--muted)}.login{display:flex;gap:8px}.login input,select{min-height:42px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}.login input{flex:1;font-size:16px}.btn{min-height:42px;border:0;border-radius:10px;background:var(--blue);color:#fff;padding:0 15px;font-weight:800;cursor:pointer}.btn.secondary{background:#64748b}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#eef4ff;border-radius:13px;padding:16px}.stat.clickable{border:0;text-align:left;color:inherit;cursor:pointer;width:100%}.stat.clickable:hover{background:#dfeaff;transform:translateY(-1px)}.stat b{display:block;font-size:25px;margin-top:5px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:800;cursor:pointer}.tab.active{background:var(--blue);color:#fff}.tableWrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;min-width:850px}.tbl th,.tbl td{text-align:left;padding:11px;border-bottom:1px solid #edf1f6;vertical-align:top}.tbl th{font-size:12px;color:var(--muted)}.badge{display:inline-block;border-radius:999px;padding:4px 8px;background:#edf3ff;font-size:11px;font-weight:800}.error{color:#b42318;white-space:pre-wrap}.tools{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.tools button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;cursor:pointer}.password-form{display:grid;grid-template-columns:minmax(180px,1fr) minmax(180px,1fr) auto;gap:8px;align-items:end}.password-form label{display:grid;gap:6px;font-size:14px;font-weight:800}.password-form input{min-height:42px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:16px}.success{color:#067647;font-weight:700}@media(max-width:760px){.password-form{grid-template-columns:1fr}.wrap{padding:18px 10px 40px}.top h1{font-size:24px}.login{flex-direction:column}.stats{grid-template-columns:1fr 1fr}.card{padding:13px}.tools{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><div class="top"><div><h1>CarRanking 관리자</h1><p class="muted">회원 · 오너리뷰 · 실소유 인증 관리</p></div><a href="../">사이트로 돌아가기</a></div><section class="card" id="auth">로그인 정보를 확인하는 중…</section><section id="dashboard" hidden><div class="stats"><button class="stat clickable" id="memberStat" type="button" title="회원목록 보기"><span>회원</span><b id="memberCount">-</b></button><div class="stat"><span>오너리뷰</span><b id="reviewCount">-</b></div><div class="stat"><span>인증대기</span><b id="pendingCount">-</b></div><div class="stat"><span>총 포인트</span><b id="pointCount">-</b></div></div><section class="card"><h2>관리자 비밀번호 변경</h2><p class="muted">현재 로그인된 관리자 계정의 비밀번호를 변경합니다. 새 비밀번호는 8자 이상 입력하세요.</p><form id="passwordForm" class="password-form"><label>새 비밀번호<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></label><label>새 비밀번호 확인<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label><button class="btn" type="submit" id="passwordSubmit">비밀번호 변경</button></form><p id="passwordMessage" class="muted" aria-live="polite"></p></section><section class="card"><div class="tools"><div class="tabs"><button class="tab active" data-view="verifications">실소유 인증</button><button class="tab" data-view="reviews">오너리뷰</button><button class="tab" data-view="members">회원</button></div><button id="refresh">새로고침</button></div><div id="content" class="tableWrap"></div></section></section></main><script src="../config.js"></script><script>
(()=>{'use strict';const C=window.CARRANKING_CONFIG||{},BASE=String(C.supabaseUrl||'').replace(/\/+$/,''),KEY=C.supabasePublishableKey||'',TOKEN='carranking_access_token';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let token=localStorage.getItem(TOKEN)||'',profiles=[],reviews=[],verifications=[],view='verifications';
function capture(){const p=new URLSearchParams(location.hash.slice(1));if(p.get('access_token')){token=p.get('access_token');localStorage.setItem(TOKEN,token);history.replaceState(null,'',location.pathname)}}
async function auth(path,opt={}){const r=await fetch(BASE+'/auth/v1/'+path,{...opt,headers:{apikey:KEY,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}}),t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch(_){}if(!r.ok)throw new Error(d.message||d.msg||t);return d}
async function req(path,opt={}){const r=await fetch(BASE+'/rest/v1/'+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}}),t=await r.text();if(!r.ok)throw new Error(t||'HTTP '+r.status);return t?JSON.parse(t):[]}
function login(msg='관리자 이메일과 비밀번호로 로그인하세요.'){$('#auth').innerHTML='<b>관리자 로그인</b><p class="muted">'+esc(msg)+'</p><div class="login"><input id="email" type="email" autocomplete="username" placeholder="관리자 이메일"><input id="loginPassword" type="password" autocomplete="current-password" placeholder="비밀번호"><button class="btn" id="send">로그인</button><button class="btn secondary" id="resetPassword" type="button">비밀번호 재설정</button></div><p id="loginMsg" class="muted"></p>';$('#send').onclick=send;$('#resetPassword').onclick=requestPasswordReset;['email','loginPassword'].forEach(id=>$('#'+id).onkeydown=e=>{if(e.key==='Enter')send()})}
async function requestPasswordReset(){const email=$('#email').value.trim(),m=$('#loginMsg'),b=$('#resetPassword');if(!email||!email.includes('@')){m.className='error';m.textContent='관리자 이메일을 먼저 입력해주세요.';return}b.disabled=true;m.className='muted';m.textContent='재설정 메일을 보내는 중…';try{await auth('recover?redirect_to='+encodeURIComponent(location.origin+'/admin/'),{method:'POST',body:JSON.stringify({email})});m.className='success';m.textContent='비밀번호 재설정 메일을 보냈습니다. 이메일의 링크를 눌러주세요.'}catch(e){m.className='error';m.textContent='재설정 메일 전송 실패: '+e.message}finally{b.disabled=false}}
async function send(){const email=$('#email').value.trim(),password=$('#loginPassword').value,m=$('#loginMsg'),b=$('#send');if(!email||!password){m.className='error';m.textContent='이메일과 비밀번호를 모두 입력해주세요.';return}b.disabled=true;m.className='muted';m.textContent='로그인 중…';try{const d=await auth('token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});token=d.access_token||'';if(!token)throw new Error('로그인 토큰을 받지 못했습니다.');localStorage.setItem(TOKEN,token);await load()}catch(e){m.className='error';m.textContent='로그인 실패: '+e.message}finally{b.disabled=false}}
function names(id){const p=profiles.find(x=>x.user_id===id);return p?.display_name||String(id||'').slice(0,8)}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='verifications'){$('#content').innerHTML=verifications.length?'<table class="tbl"><thead><tr><th>신청일</th><th>회원</th><th>인증방법</th><th>자료</th><th>상태</th><th>관리자 메모</th></tr></thead><tbody>'+verifications.map(v=>'<tr><td>'+esc(String(v.created_at||'').replace('T',' ').slice(0,16))+'</td><td>'+esc(names(v.user_id))+'</td><td>'+esc(v.verification_type)+'</td><td>'+(v.evidence_url?'<a href="'+esc(v.evidence_url)+'" target="_blank" rel="noopener">자료 열기 ↗</a>':'-')+'</td><td><select data-vid="'+esc(v.verification_id)+'">'+['대기','승인','반려'].map(s=>'<option'+(s===v.status?' selected':'')+'>'+s+'</option>').join('')+'</select></td><td><input data-note="'+esc(v.verification_id)+'" value="'+esc(v.admin_note||'')+'" placeholder="메모 입력"></td></tr>').join('')+'</tbody></table>':'<p>인증 신청이 없습니다.</p>';document.querySelectorAll('[data-vid]').forEach(s=>s.onchange=()=>saveVerification(s.dataset.vid,s.value))}else if(view==='reviews'){$('#content').innerHTML=reviews.length?'<table class="tbl"><thead><tr><th>등록일</th><th>회원</th><th>제목/내용</th><th>보유정보</th><th>인증</th><th>도움</th></tr></thead><tbody>'+reviews.map(r=>'<tr><td>'+esc(String(r.created_at||'').slice(0,10))+'</td><td>'+esc(names(r.user_id))+'</td><td><b>'+esc(r.title||'제목 없음')+'</b><br>'+esc(r.body||'')+'</td><td>'+esc(r.model_year||'-')+'년 · '+esc(r.mileage_km||'-')+'km · '+esc(r.owned_months||'-')+'개월</td><td><span class="badge">'+esc(r.ownership_status||'미인증')+'</span></td><td>'+Number(r.helpful_count||0)+'</td></tr>').join('')+'</tbody></table>':'<p>오너리뷰가 없습니다.</p>'}else{$('#content').innerHTML=profiles.length?'<table class="tbl"><thead><tr><th>가입일</th><th>이메일</th><th>회원명</th><th>권한</th><th>레벨</th><th>포인트</th><th>리뷰</th><th>인증리뷰</th><th>도움받음</th></tr></thead><tbody>'+profiles.map(p=>'<tr><td>'+esc(String(p.joined_at||'').replace('T',' ').slice(0,16))+'</td><td><b>'+esc(p.email||'-')+'</b><br><small>'+(p.email_confirmed_at?'인증완료':'미인증')+'</small></td><td>'+esc(p.display_name||'-')+'</td><td><span class="badge">'+esc(p.role||'user')+'</span></td><td>LV.'+Number(p.level||1)+'</td><td>'+Number(p.points||0).toLocaleString()+'</td><td>'+Number(p.review_count||0)+'</td><td>'+Number(p.verified_review_count||0)+'</td><td>'+Number(p.helpful_received||0)+'</td></tr>').join('')+'</tbody></table>':'<p>회원이 없습니다.</p>'}}
async function updatePassword(e){e.preventDefault();const password=$('#newPassword').value,confirm=$('#confirmPassword').value,m=$('#passwordMessage'),b=$('#passwordSubmit');m.className='muted';if(password.length<8){m.className='error';m.textContent='비밀번호는 8자 이상 입력해주세요.';return}if(password!==confirm){m.className='error';m.textContent='새 비밀번호가 서로 일치하지 않습니다.';return}b.disabled=true;m.textContent='변경 중…';try{await auth('user',{method:'PUT',body:JSON.stringify({password})});$('#passwordForm').reset();m.className='success';m.textContent='관리자 비밀번호가 변경되었습니다.'}catch(e){m.className='error';m.textContent='변경 실패: '+e.message}finally{b.disabled=false}}
async function saveVerification(id,status){const note=document.querySelector('[data-note="'+CSS.escape(id)+'"]')?.value||'';try{await req('ownership_verifications?verification_id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status,admin_note:note,reviewed_at:new Date().toISOString()})});const x=verifications.find(v=>v.verification_id===id);if(x){x.status=status;x.admin_note=note}alert('저장되었습니다.')}catch(e){alert('저장 실패: '+e.message)}}
async function load(){capture();if(!token){login();return}try{const currentUser=await auth('user',{method:'GET'});profiles=await req('rpc/admin_list_members',{method:'POST',body:'{}'});reviews=await req('reviews?select=id,user_id,title,body,status,created_at&order=created_at.desc&limit=500').catch(()=>[]);verifications=[];if(!profiles.some(p=>p.user_id===currentUser.id&&p.role==='admin'))throw new Error('현재 계정의 관리자 권한이 확인되지 않았습니다.');$('#auth').innerHTML='<b>관리자 인증 완료</b><p class="muted">회원·리뷰·실소유 인증 데이터를 관리할 수 있습니다.</p>';$('#dashboard').hidden=false;$('#memberCount').textContent=profiles.length;$('#reviewCount').textContent=reviews.length;$('#pendingCount').textContent=verifications.filter(v=>v.status==='대기').length;$('#pointCount').textContent=profiles.reduce((a,p)=>a+Number(p.points||0),0).toLocaleString();render()}catch(e){localStorage.removeItem(TOKEN);token='';login('관리자 권한이 확인되지 않았습니다. 허용된 관리자 이메일로 다시 로그인해주세요.');$('#dashboard').hidden=true}}
$('#passwordForm').addEventListener('submit',updatePassword);document.addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){view=b.dataset.view;render()}});$('#memberStat').onclick=()=>{view='members';render();document.querySelector('.card .tools')?.scrollIntoView({behavior:'smooth',block:'start'})};$('#refresh').onclick=load;load()})();
</script></body></html>
